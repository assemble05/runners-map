name: Task
description: A piece of work written as a spec. One task is one pull request.
labels: ["task", "needs-triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Numbered checklist S1, S2…, in order of work.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "AC1 WHEN … THEN …; edge cases marked [edge]."
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: What must be proven, by AC. Never the kind of test.
  - type: textarea
    id: where
    attributes:
      label: Where to look
  - type: input
    id: blocked
    attributes:
      label: Blocked by
      placeholder: "#12, #15 or none"
  - type: textarea
    id: input
    attributes:
      label: Needs input
